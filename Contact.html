    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styelcontact.css">

    <title>Contact - ISMOX STUDING</title>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <h1 class="h1">
            I<span>S</span>M<span>O</span>X
            S<span>T</span>U<span>D</span>I<span>N</span>G
        </h1>

        <nav>
            <a href="./index.html">Accueil</a>
            <a href="./info.html">À propos</a>
        </nav>

    </header>


    <!-- CONTACT -->
    <main>

        <section class="contact">

            <div class="contact-title">

                <p>
                    CONTACTEZ-NOUS
                </p>

                <h1>
                    Une question ?
                </h1>

                <p>
                    Si vous avez une question ou une suggestion
                    concernant ISMOX STUDING, vous pouvez nous contacter.
                </p>

            </div>


            <!-- CONTACT FORM -->
            <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
                <div class="form-group">

                    <input type="hidden"  name="access_key" value="d6118990-ef9e-4fa2-a2c2-cb19fe24f6ea">
                </div>

                <div class="form-group">

                    <label for="name">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Votre nom"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Votre adresse email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Sujet
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Sujet de votre message"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="Écrivez votre message..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Envoyer le message
                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

    <div class="footer-logo">
        ISMOX STUDING
    </div>

    <div class="footer-contact">
        
        <a href="https://www.instagram.com/ismox_prog/" target="_blank" class="instagram">

        />

        <circle
            cx="17.5"
            cy="6.5"
            r="1"
            fill="currentColor"
        />

    </svg>

    Instagram

</a>


    </div>

</footer>
